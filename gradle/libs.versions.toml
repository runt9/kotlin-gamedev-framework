[versions]
kotlin = "2.4.10"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
# KTX's newest release (1.13.1-rc1) officially targets libGDX 1.13.1, so anything past that is ahead of what KTX
# was built against. Verify by booting the game, not by a green compile -- a KTX/libGDX mismatch surfaces as a
# runtime NoSuchMethodError, which compiles perfectly.
gdx = "1.14.2"
gdxAi = "1.8.2"
ktx = "1.13.1-rc1"
korlibs = "4.0.10"
kotest = "6.2.4"
junitPlatformLauncher = "6.1.3"
# Below 0.53.0 this plugin is broken on Gradle 9.3+: it calls LenientConfiguration.getFirstLevelModuleDependencies,
# which was removed, and `dependencyUpdates` fails outright rather than degrading.
versionsPlugin = "0.61.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
gdx-ai = { module = "com.badlogicgames.gdx:gdx-ai", version.ref = "gdxAi" }
freetype-stripe = { module = "com.github.raeleus.stripe:freetype", version = "2.0.0" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version = "8.0.4" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.18" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.6.3" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5-jvm", version.ref = "kotest" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine-jvm", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformLauncher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
versions = { id = "com.github.ben-manes.versions", version.ref = "versionsPlugin" }
